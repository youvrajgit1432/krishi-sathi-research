name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP lint
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null || fail=1
          done < <(find . -name '*.php' -not -path '*/vendor/*')
          exit $fail
